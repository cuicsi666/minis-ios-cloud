name: build-ios

on:
  push:
    branches: [ main ]
    paths:
      - 'src/ios/**'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Toolchain versions
        run: |
          xcodebuild -version
          sw_vers
          uname -m

      - name: Metal Toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain || echo "metal-download-failed(ok if already present)"

      - name: Install Homebrew deps
        run: |
          brew install ninja llvm libarchive pkg-config meson lld || brew link --overwrite ninja llvm libarchive pkg-config meson lld || true
          meson --version || python3 -m pip install --break-system-packages --user meson || true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Verify metal compiler
        run: |
          xcrun -sdk iphoneos metal --version || echo "no-metal-compiler(yadif_videotoolbox may drop)"

      - name: Build native deps (lame -> ffmpeg -> ish -> rootfs -> rclone)
        run: |
          # Homebrew LLVM carries lld; the VDSO step of iSH needs
          # `-fuse-ld=lld` to resolve. Prepend its bin so both clang and
          # ld.lld resolve consistently.
          export PATH="/opt/homebrew/opt/llvm/bin:$PATH"
          clang --version | head -1
          which ld.lld lld 2>/dev/null || true
          set -e
          # [Minis_R] actions/checkout's submodule pull is flaky (occasionally
          # leaves deps/ish empty). Make sure the two build submodules are
          # actually present before compiling, else build_ish/proot die.
          for d in deps/ish deps/proot; do
            if [ ! -d "$d" ] || [ -z "$(ls -A "$d" 2>/dev/null)" ]; then
              echo "⟲ $d missing — force re-init submodule"
              git submodule update --init --recursive --force "$d" || true
            fi
            if [ ! -d "$d" ] || [ -z "$(ls -A "$d" 2>/dev/null)" ]; then
              echo "❌ $d still absent after submodule update"
              exit 1
            fi
            echo "✅ $d present ($(ls "$d" | wc -l) entries)"
          done
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh
        env:
          CI: 'true'

      - name: 注入云通道令牌
        env:
          CLOUD_TOKEN: ${{ secrets.CLOUD_TOKEN }}
        run: |
          echo "::add-mask::$CLOUD_TOKEN"
          python3 - <<'PY'
          import base64, os, pathlib
          tok = (os.environ.get("CLOUD_TOKEN") or "").strip()
          p = pathlib.Path("src/ios/Providers/ProviderConfigStore.swift")
          s = p.read_text(encoding="utf-8")
          if "__CLOUD_TOKEN_B64__" in s:
              b64 = base64.b64encode(tok.encode()).decode()
              p.write_text(s.replace("__CLOUD_TOKEN_B64__", b64), encoding="utf-8")
              print("云通道令牌已注入（token 长度 %d）" % len(tok))
          else:
              print("占位符不存在，跳过")
          PY

      - name: xcodebuild (no-codesign)
        run: |
          set -e
          # ProviderCustomization.xcconfig is not committed; copy from its
          # example template (app compiles & runs with empty values).
          if [ ! -f src/ios/Configs/ProviderCustomization.xcconfig ]; then
            cp src/ios/Configs/ProviderCustomization.xcconfig.example \
               src/ios/Configs/ProviderCustomization.xcconfig
          fi
          set -o pipefail
          set -x
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/xcbuild.log | tail -200 || true
          set +x
          test -d build/Build/Products/Release-iphoneos || { echo "===== 构建失败，完整日志尾部 ====="; tail -500 /tmp/xcbuild.log; echo "===== 错误行 ====="; grep -n "error:" /tmp/xcbuild.log | head -40; exit 1; }

      - name: Package IPA
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "Minis.app" -print -quit)
          echo "APP=$APP"
          test -n "$APP" || { echo "app bundle missing"; exit 1; }
          echo "----- .app 顶层内容 -----"
          ls -la "$APP" | head -40
          test -f "$APP/Info.plist" || { echo "!! Info.plist 不在 .app 内"; exit 1; }
          EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          echo "CFBundleExecutable = $EXEC"
          test -f "$APP/$EXEC" || { echo "!! 主可执行文件缺失: $EXEC"; exit 1; }
          rm -rf ipa && mkdir -p ipa/Payload
          ditto "$APP" "ipa/Payload/Minis.app"
          test -f "ipa/Payload/Minis.app/Info.plist" || { echo "!! ditto 复制后 Info.plist 丢失"; exit 1; }
          cd ipa
          ditto -c -k --sequesterRsrc --keepParent Payload ../云Minis原版_V1.ipa
          cd ..
          echo "----- IPA 内容校验 -----"
          unzip -l 云Minis原版_V1.ipa | head -12
          unzip -l 云Minis原版_V1.ipa | grep -E "Payload/Minis.app/(Info.plist|$EXEC)$" || { echo "!! IPA 内缺少关键文件"; exit 1; }
          ls -lh *.ipa
          tar czf Minis.app.tar.gz -C build/Build/Products/Release-iphoneos Minis.app
          ls -lh Minis.app.tar.gz

      - name: 构建日志留存
        if: always()
        run: cp /tmp/xcbuild.log "$GITHUB_WORKSPACE/xcbuild.log" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minis-cloud-ipa
          path: |
            云Minis原版_V1.ipa
            Minis.app.tar.gz
            xcbuild.log
          if-no-files-found: warn
